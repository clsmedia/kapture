services:
  kapture:
    build: .
    container_name: kapture
    ports:
      - "8527:8000"
    env_file: .env
    volumes:
      # public/index.php requires the .env FILE on disk, not just env vars.
      - ./.env:/app/.env:ro
      # Persist captured requests across container restarts.
      - ./logs:/app/logs
      # Live-mount source so code changes apply without rebuilding the image.
      - ./src:/app/src
      - ./public:/app/public
    restart: unless-stopped
